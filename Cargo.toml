[package]
name = "whereami"
version = "0.1.0"
edition = "2024"
description = "Print the current street address, coordinates and time zone using CoreLocation"
license = "MIT"
repository = "https://github.com/alisezer/whereami"
readme = "README.md"
keywords = ["location", "corelocation", "geocoding", "macos", "cli"]
categories = ["command-line-utilities", "os::macos-apis"]
publish = false

[dependencies]
# block2, objc2-contacts and objc2-map-kit are part of the objc2 project: block2 for
# completion handlers, objc2-contacts for CNPostalAddressFormatter (locale-correct
# address lines, no Contacts permission needed), objc2-map-kit for nearby places.
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-contacts = { version = "0.3.2", default-features = false, features = [
    "std",
    "CNPostalAddress",
    "CNPostalAddressFormatter",
] }
objc2-core-location = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "CLError",
    "CLGeocoder",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
    "CLPlacemark",
    "objc2-contacts",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSFormatter",
    "NSISO8601DateFormatter",
    "NSObjCRuntime",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSTimeZone",
    "NSURL",
] }
objc2-map-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-location",
    "MKLocalPointsOfInterestRequest",
    "MKLocalSearch",
    "MKLocalSearchResponse",
    "MKMapItem",
    "MKPlacemark",
    "MKPointOfInterestCategory",
    "MKPointOfInterestFilter",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
